parameters:
    xlims: [-0.08, 0.08] # 160 mm
    zlims: [0.05, 0.10] # 50 mm
    grid_size_x: 1536 # 0.104 mm isotropic pixels
    grid_size_z: 480
    dynamic_range: [-50, 0]
pipeline:
    operations:
    -   name: keras.ops.cast
        params:
            dtype: float32
    - demodulate
    -   name: beamform
    - envelope_detect
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
